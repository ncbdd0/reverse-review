<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2340">
<title>逆向工程复习站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2340'/%3E%3Cpath d='M32 14a10 10 0 0 0-10 10v6h-2a4 4 0 0 0-4 4v14a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V34a4 4 0 0 0-4-4h-2v-6a10 10 0 0 0-10-10zm-4 16v-6a4 4 0 1 1 8 0v6h-8z' fill='%23f5c542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=11">
<script defer src="assets/pdf.min.js?v=11"></script>
<script defer src="assets/mammoth.browser.min.js?v=11"></script>
<script defer src="assets/app.js?v=11"></script>
</head>
<body>

<!-- ===== 访问密码门 ===== -->
<div id="gate" class="overlay">
  <div class="gate-card">
    <div class="gate-lock">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" rx="16"/><path d="M32 14a10 10 0 0 0-10 10v6h-2a4 4 0 0 0-4 4v14a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V34a4 4 0 0 0-4-4h-2v-6a10 10 0 0 0-10-10zm-4 16v-6a4 4 0 1 1 8 0v6h-8z"/></svg>
    </div>
    <h1 class="brand-serif">逆向工程复习站</h1>
    <p class="gate-sub">私有复习资料 · 请输入访问密码解锁</p>
    <form id="gate-form" autocomplete="off">
      <div class="pw-wrap">
        <input id="gate-pw" class="recessed" type="password" placeholder="访问密码" autocomplete="off" autofocus>
        <button type="button" class="pw-eye" id="gate-eye" tabindex="-1">显示</button>
      </div>
      <div id="gate-err" class="form-err"></div>
      <button class="btn btn-primary btn-block" id="gate-btn" type="submit">解锁内容</button>
    </form>
    <p class="gate-note">内容以加密形式存放，密码仅保存在你手中。解锁后本次会话内免重复输入。</p>
  </div>
</div>

<!-- ===== 登录页 ===== -->
<div id="login" class="overlay hidden">
  <div class="gate-card">
    <h1 class="brand-serif">逆向工程复习站</h1>
    <p class="gate-sub">登录你的账号，练习进度与错题本将跨设备同步</p>
    <form id="login-form" autocomplete="off">
      <div class="field"><label for="login-user">账号</label>
        <input id="login-user" class="recessed" type="text" placeholder="你的账号名" autocomplete="off" maxlength="24"></div>
      <div class="field"><label for="login-pw">密码</label>
        <div class="pw-wrap"><input id="login-pw" class="recessed" type="password" placeholder="账号密码（至少4位）" autocomplete="off">
        <button type="button" class="pw-eye" id="login-eye" tabindex="-1">显示</button></div></div>
      <div id="login-err" class="form-err"></div>
      <button class="btn btn-primary btn-block" id="login-btn" type="submit">登录 / 首次使用自动创建</button>
    </form>
    <button class="btn btn-ghost btn-block" id="guest-btn">以游客身份进入（不同步）</button>
    <p class="gate-note">同一账号密码在手机、电脑登录，错题本与练习记录自动同步。账号数据以加密方式保存在云端，仅凭你的账号密码可解。</p>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app" class="hidden">
  <header id="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand"><span class="brand-dot"></span>逆向工程复习站</div>
      <nav id="mainnav" class="mainnav">
        <a href="#/home" data-route="home">首页</a>
        <a href="#/recite" data-route="recite">背题</a>
        <a href="#/quiz" data-route="quiz">做题</a>
        <a href="#/wrong" data-route="wrong">错题本</a>
        <a href="#/docs" data-route="docs">文档中心</a>
        <a href="#/settings" data-route="settings">设置</a>
      </nav>
      <div class="topbar-right">
        <span id="sync-badge" class="sync-badge" title="同步状态">·</span>
        <span id="whoami" class="whoami"></span>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a href="#/home" data-route="home"><span class="t-ico">⌂</span>首页</a>
    <a href="#/recite" data-route="recite"><span class="t-ico">❐</span>背题</a>
    <a href="#/quiz" data-route="quiz"><span class="t-ico">✎</span>做题</a>
    <a href="#/wrong" data-route="wrong"><span class="t-ico">★</span>错题本</a>
    <a href="#/docs" data-route="docs"><span class="t-ico">▤</span>文档</a>
    <a href="#/settings" data-route="settings"><span class="t-ico">⚙</span>设置</a>
  </nav>
</div>

<!-- 通用弹层 -->
<div id="modal" class="modal hidden"><div class="modal-mask"></div><div class="modal-body" id="modal-body"></div></div>
<div id="toast" class="toast hidden"></div>

</body>
</html>
